spring:
  application:
    name: auth-service
  cloud:
    config:
      discovery:
        enable: true
      service-id: auth-service
  config:
    import: optional:configserver:http://localhost:8888
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    jpa:
      spring.jpa.database-platform: org.hibernate.dialect.H2Dialect
server:
  port: 8081
  h2:
    console:
      enable: true
      path: :/h2-console
logging:
  level:
    org:
      springframework:
        security: ${SPRING_LOG_LEVEL:TRACE}
