services:
  eureka-server:
    image: "mayurjagtap/eureka-service-discovery:v1"
    container_name: "eureka-ms"
    ports:
      - "8761:8761"
    deploy:
      resources:
        limits:
          memory: 700m
    extends:
      file: common-config.yml
      service: network-deploy-service 
  configservice:
    image: "mayurjagtap/config-service:v1"
    container_name: config-ms
    ports:
      - "8888:8888"
    healthcheck:
      test: "curl --fail --silent localhost:8888/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config
  orderdb:
    image: "postgres:16"
    container_name: "orderdb"
    volumes:
      - order_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 10s
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "mars"
    extends:
      file: common-config.yml
      service: network-deploy-service
  order:
    image: "mayurjagtap/order-service:v1"
    container_name: order-ms
    ports:
      - "8088:8088"
    environment:
      SPRING_APPLICATION_NAME: "order"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://orderdb:5432/mars"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
  inventorydb:
    image: "postgres:16"
    container_name: "inventorydb"
    volumes:
      - inventory_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 10s
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "aqua"
    networks:
      - ecomm
  inventory:
    image: "mayurjagtap/inventory-service:v1"
    container_name: inventory-ms
    ports:
      - "8085:8085"
    environment:
      SPRING_APPLICATION_NAME: "inventory"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://inventorydb:5433/aqua"
    extends:
      file: common-config.yml
      service: microservice-configserver-config
      
networks:
  ecomm:
    driver: bridge
volumes:
  order_pg_data:
  inventory_pg_data:
