server:
  port: 8085
spring:
  application:
    name: inventoryservice
  datasource:
    url: jdbc:postgresql://localhost:5432/aqua
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  profiles:
    active: "prod"
  config:
    import: "optional:configserver:http://localhost:8888"
#spring.jpa.properties.hibernate.jdbc.time_zone= Asia/Kolkata
management:
  endpoints:
    web:
      exposure:
        include: "*"
