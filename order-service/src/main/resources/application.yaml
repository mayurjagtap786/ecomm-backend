server:
  port: 8088
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/mars
    username: ${DB_USER:postgres}
    password: ${DB_SECRET:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
  profiles:
    active:
      - qa

build:
  version: "1.0"

order:
  message: "Welcome to order-service of ecomm application"
  contactDetails:
    name: "Mayur Jagtap"
    email: "support@ecomm.com"
  onCallSupport:
    - (555)555-1234
    - (666)666-9874
