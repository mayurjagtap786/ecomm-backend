server:
  port: 8088
spring:
  application:
    name: order-service
#spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost:5432}/mars?TimeZone=Asia/Kolkata
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/mars
    username: ${DB_USER:postgres}
    password: ${DB_SECRET:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
  properties:
    hibernate:
    dialect: org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.jdbc.time_zone= Asia/Kolkata

